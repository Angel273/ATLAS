packages:
  - apps/*
  - packages/*

saveExact: true
engineStrict: true
verifyDepsBeforeRun: warn
overrides:
  '@prisma/config>deepmerge-ts': 8.0.2
  'exceljs>uuid': 11.1.1
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  msgpackr-extract: false
patchedDependencies:
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
